# The 90-second demo path (docs/DEMO.md), in Burmese.
appId: org.ifiusa.known.dev
---
- runFlow: { file: subflows/fresh-start.yaml, env: { LANG: "my" } }

# Encounter: the Fear picture → Nehemiah 1
- runFlow: { file: subflows/pick.yaml, env: { A: "2" } }
- assertVisible: "နေဟမိ.*"

# Response: a say-line joins the prayer card; edit the prayer; Amen
- tapOn: { id: "to-pray" }
- tapOn: { id: "say-0" }
- assertVisible: { id: "prayer-stay" }
- tapOn: { id: "prayer-input" }
- inputText: " ."
- hideKeyboard
- tapOn: { id: "amen" }

# Continuation: reach out to the guide, who reads English; translate when a relay is set
- tapOn: { id: "a-reach" }
- tapOn: { id: "to-guide" }
- tapOn: { id: "reader-en" }
- runFlow:
    when:
      visible: { id: "translate" }
    commands:
      - tapOn: { id: "translate" }
      - extendedWaitUntil:
          visible: { id: "back-translation" }
          timeout: 20000
- tapOn: { id: "keep-msg" }
- tapOn: { id: "back-choices" }
- tapOn: { id: "a-keep" }
- tapOn: { id: "save-moment" }
- assertVisible: { id: "screen-done" }

# Safety: a second moment, ✕ → Save this step for later
- tapOn: { id: "done-home" }
- runFlow: { file: subflows/pick.yaml, env: { A: "1" } }
- tapOn: { id: "header-x" }
- tapOn: { id: "exit-save" }
- assertVisible: { id: "screen-paused" }
