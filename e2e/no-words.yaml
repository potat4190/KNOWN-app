# "I don't have the words" → Psalm 77, paired with a Help link that opens Help.
appId: org.ifiusa.known.dev
---
- runFlow: subflows/fresh-start.yaml
- tapOn: { id: "begin" }
- tapOn: { id: "no-words" }
- scrollUntilVisible:
    element: { id: "page-card" }
    direction: DOWN
- assertVisible: "Psalm 77:1–4"
- tapOn: { id: "nw-help" }
- assertVisible: { id: "screen-help" }
- assertVisible: { id: "help-findahelpline" }
